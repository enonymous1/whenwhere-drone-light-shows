# Deploy the WhenWhere drone light shows page to GitHub Pages.
#
# Every push to main rebuilds index.html from tools/source.html
# (tools/build.py), runs the Formation Studio smoke test, and deploys the
# freshly built site — so the live page is always current with the repo,
# even if the committed index.html is stale. Pull requests run the build
# and the smoke test but do not deploy; they also fail if the committed
# index.html differs from a fresh build, so the repo stays honest.
#
# One-time setup (repo owner): Settings -> Pages -> Build and deployment
# -> Source: GitHub Actions. Then push to main and watch this run.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The starter-workflow permission set: the build job needs read access,
# the deploy job needs Pages write + OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install Pillow

      - name: Build the page
        run: python3 tools/build.py

      # A PR that changes the generator or its source without rebuilding
      # the committed page fails here, so the repo never lands a stale
      # index.html. (On push to main this check is skipped: the deploy
      # below publishes the freshly built page regardless.)
      - name: Committed page must match a fresh build
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- index.html

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v2

      - name: Smoke test the Formation Studio
        run: node tests/smoke.mjs

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
